name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # The whole suite runs on MySQL 8.4, as production does
  # (docs/claude/decisions/2026-11-27-full-suite-on-mysql.md).
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -ppassword" --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    # Plain bash (no -e/pipefail): each step captures its own exit code so
    # it can save the log for the failure report.
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        id: setup
        run: composer setup 2>&1 | tee "$RUNNER_TEMP/setup.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/setup.failed"; exit $s

      # Every migration's down must work: roll everything back, then migrate
      # again (framework stack rule).
      - name: Migrations roll back
        id: rollback
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: (php artisan migrate:rollback --force && php artisan migrate --force) 2>&1 | tee "$RUNNER_TEMP/rollback.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/rollback.failed"; exit $s

      # Each check runs on its own (so one failure doesn't hide the others)
      # and posts its output as annotations when it fails.

      - name: Lint and format (JS)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check 2>&1 | tee "$RUNNER_TEMP/js-lint.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/js-lint.failed"; exit $s

      - name: Types (TS)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run types:check 2>&1 | tee "$RUNNER_TEMP/ts.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/ts.failed"; exit $s

      - name: Frontend tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm test 2>&1 | tee "$RUNNER_TEMP/vitest.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/vitest.failed"; exit $s

      - name: Pint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vendor/bin/pint --test 2>&1 | tee "$RUNNER_TEMP/pint.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/pint.failed"; exit $s

      - name: PHPStan
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=raw 2>&1 | tee "$RUNNER_TEMP/phpstan.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/phpstan.failed"; exit $s

      - name: PHPUnit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          php artisan config:clear --ansi || exit 1
          php artisan test --compact 2>&1 | tee "$RUNNER_TEMP/phpunit.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/phpunit.failed"; exit $s

      - name: Report failures
        if: ${{ failure() }}
        run: |
          for check in setup rollback js-lint ts vitest pint phpstan phpunit; do
            if [ -f "$RUNNER_TEMP/$check.failed" ]; then
              .github/scripts/annotate.sh "$check" "$RUNNER_TEMP/$check.log" || true
            fi
          done

  # Any advisory in a PHP or npm dependency fails the build
  # (docs/claude/decisions/2026-11-27-dependency-audits.md).
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Composer audit
        run: composer audit --locked

      - name: npm audit
        run: npm audit
